# @package _global_
# Full-val CoTracker3. Prefer the clip-sharded launcher (no DDP):
#   python -m mvtracker.cli.eval_nusctrack_parallel --dataset nusctrack-val --gpus all
defaults:
  - eval
  - override /model: cotracker3_offline
  - _self_

modes:
  eval_only: true

experiment_path: /share/tgp/yangyi/mvtracker/logs/cotracker3_offline_nusctrack_val

restore_ckpt_path: null

datasets:
  eval:
    names:
      - nusctrack-val
    num_workers: 0

evaluation:
  interp_shape: null
  predictor_settings:
    generic:
      visibility_threshold: 0.5
      grid_size: 0
      n_grids_per_view: 1
      local_grid_size: 0
      local_extent: 50
      sift_size: 0
      num_uniformly_sampled_pts: 0
  evaluator:
    rerun_viz_indices: null
    forward_pass_log_indices: null
    mp4_track_viz_indices: null
    save_tracks_npz: false
    dump_nusctrack_metrics: true
