# @package _global_
# TAPIP3D + UniDepth smoke (2 clips). Prefer the clip-sharded launcher:
#   python -m mvtracker.cli.eval_nusctrack_parallel --model tapip3d --dataset nusctrack-val-max2 --gpus 2
defaults:
  - eval
  - override /model: tapip3d
  - _self_

modes:
  eval_only: true

experiment_path: /share/tgp/yangyi/mvtracker/logs/tapip3d_nusctrack_max2

restore_ckpt_path: null

datasets:
  eval:
    names:
      - nusctrack-val-max2
    num_workers: 0

evaluation:
  interp_shape: [384, 512]
  predictor_settings:
    generic:
      visibility_threshold: 0.5
      grid_size: 0
      n_grids_per_view: 1
      local_grid_size: 0
      local_extent: 50
      sift_size: 0
      num_uniformly_sampled_pts: 0
    kubric:
      visibility_threshold: 0.5
      grid_size: 0
    dex_ycb:
      visibility_threshold: 0.5
      grid_size: 0
    panoptic:
      visibility_threshold: 0.5
      grid_size: 0
  evaluator:
    rerun_viz_indices: null
    forward_pass_log_indices: null
    mp4_track_viz_indices: null
    save_tracks_npz: false
    dump_nusctrack_metrics: true
