# @package _global_
# SurroundTAP v1 = MVTracker kNN + staged coarse BEV XY head.
# Does NOT replace default model or SurroundTAP v0. Enable with:
#   +experiment=surround_tap_v1_nusctrack_coarse
defaults:
  - default

model:
  _target_: mvtracker.models.core.surround_tap.surround_tap_v1.SurroundTAPV1
  sliding_window_len: 12
  stride: 4
  normalize_scene_in_fwd_pass: false
  fmaps_dim: 128
  add_space_attn: true
  num_heads: 6
  hidden_size: 256
  space_depth: 6
  time_depth: 6
  num_virtual_tracks: 64
  use_flash_attention: true
  corr_n_groups: 1
  corr_n_levels: 4
  corr_neighbors: 16
  corr_add_neighbor_offset: true
  corr_add_neighbor_xyz: false
  corr_filter_invalid_depth: false
  bev_x_min: -51.2
  bev_x_max: 51.2
  bev_y_min: -51.2
  bev_y_max: 51.2
  bev_resolutions:
    - 1.6
    - 0.8
  bev_corr_radius: 4
  coarse_detach: true
  coarse_attn_heads: 4

evaluation:
  interp_shape: null
  predictor_settings:
    generic:
      visibility_threshold: 0.5
      grid_size: 0
      n_grids_per_view: 1
      local_grid_size: 0
      local_extent: 50
      sift_size: 0
      num_uniformly_sampled_pts: 0

trainer:
  precision: bf16-mixed
