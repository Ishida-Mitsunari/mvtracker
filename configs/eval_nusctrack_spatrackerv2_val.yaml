# @package _global_
# Full-val SpaTrackerV2 + UniDepth. Prefer the clip-sharded launcher (no DDP):
#   /share/tgp/yangyi/envs/spatrackerv2/bin/python -m mvtracker.cli.eval_nusctrack_parallel \
#     --model spatrackerv2 --dataset nusctrack-val --gpus 0,1,2,3,4,5,6,7
defaults:
  - eval
  - override /model: spatialtrackerv2
  - _self_

modes:
  eval_only: true

experiment_path: /share/tgp/yangyi/mvtracker/logs/spatrackerv2_nusctrack_val

restore_ckpt_path: null

model:
  model:
    model_type: offline
    vo_points: 756

datasets:
  eval:
    names:
      - nusctrack-val
    num_workers: 0

evaluation:
  interp_shape: [384, 512]
  predictor_settings:
    generic:
      visibility_threshold: 0.5
      grid_size: 0
      n_grids_per_view: 1
      local_grid_size: 0
      local_extent: 50
      sift_size: 0
      num_uniformly_sampled_pts: 0
    kubric:
      visibility_threshold: 0.5
      grid_size: 0
    dex_ycb:
      visibility_threshold: 0.5
      grid_size: 0
    panoptic:
      visibility_threshold: 0.5
      grid_size: 0
  evaluator:
    rerun_viz_indices: null
    forward_pass_log_indices: null
    mp4_track_viz_indices: null
    save_tracks_npz: false
    dump_nusctrack_metrics: true
