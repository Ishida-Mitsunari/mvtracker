# @package _global_
# Train only the SurroundTAP v1 coarse BEV head on NuscTrack.
# Fine branch is frozen MVTracker Kubric+FT. Independent experiment_path.
# Example:
#   CUDA_VISIBLE_DEVICES=0,1,2,3,4,5 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \\
#   python -m mvtracker.cli.train +experiment=surround_tap_v1_nusctrack_coarse
defaults:
  - override /model: surround_tap_v1

experiment_path: /share/tgp/yangyi/mvtracker/logs/surround_tap_v1_nusctrack_coarse
restore_ckpt_path: /share/tgp/yangyi/mvtracker/logs/mvtracker_nusctrack_ft/model_final.pth

datasets:
  train:
    name: nusctrack-train
    batch_size: 1
    sequence_len: 24
    traj_per_sample: 384
    num_workers: 4
  eval:
    names:
      - nusctrack-val-max2
    num_workers: 2

trainer:
  num_steps: 2000
  eval_freq: 500
  viz_freq: 2000
  save_ckpt_freq: 500
  lr: 0.0001
  gamma: 0.8
  wdecay: 0.00001
  anneal_strategy: linear
  grad_clip: 1.0
  precision: bf16-mixed
  visibility_loss_weight: 0.1
  train_iters: 4
  augment_train_iters: false
  coarse_loss_weight: 0.4
  coarse_huber_delta: 0.8
  coarse_disp_thresh: 2.0
  trainable_name_prefixes:
    - coarse_

evaluation:
  interp_shape: null
  predictor_settings:
    generic:
      visibility_threshold: 0.5
      grid_size: 0
      n_grids_per_view: 1
      local_grid_size: 0
      local_extent: 50
      sift_size: 0
      num_uniformly_sampled_pts: 0
  evaluator:
    rerun_viz_indices: null
    forward_pass_log_indices: null
    mp4_track_viz_indices: null

augmentations:
  probability: 0

modes:
  validate_at_start: false
  do_initial_static_pretrain: false
  pretrain_only: false
  eval_only: false
  debug: false

logging:
  log_wandb: false
  tags: ["nusctrack", "surround_tap_v1", "coarse-head", "frozen-ft"]
