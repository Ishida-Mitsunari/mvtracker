# @package _global_
# SurroundTAP fine-tune on NuscTrack (Kubric MVTracker weights + new BEV fuse head).
# Does not touch mvtracker_nusctrack_ft / scratch experiment paths.
# Example (skip busy GPUs 6,7):
#   CUDA_VISIBLE_DEVICES=0,1,2,3,4,5 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \\
#   python -m mvtracker.cli.train +experiment=surround_tap_nusctrack_ft
defaults:
  - override /model: surround_tap

experiment_path: /share/tgp/yangyi/mvtracker/logs/surround_tap_nusctrack_ft
restore_ckpt_path: /share/tgp/yangyi/mvtracker/checkpoints/mvtracker_200000_june2025.pth

datasets:
  train:
    name: nusctrack-train
    batch_size: 1
    sequence_len: 24
    traj_per_sample: 384
    num_workers: 4
  eval:
    names:
      - nusctrack-val-max2
    num_workers: 2

trainer:
  num_steps: 7000
  eval_freq: 1000
  viz_freq: 2000
  save_ckpt_freq: 500
  lr: 0.00005
  gamma: 0.8
  wdecay: 0.00001
  anneal_strategy: linear
  grad_clip: 1.0
  precision: bf16-mixed
  visibility_loss_weight: 0.1
  train_iters: 4
  augment_train_iters: false

evaluation:
  interp_shape: null
  predictor_settings:
    generic:
      visibility_threshold: 0.5
      grid_size: 0
      n_grids_per_view: 1
      local_grid_size: 0
      local_extent: 50
      sift_size: 0
      num_uniformly_sampled_pts: 0
  evaluator:
    rerun_viz_indices: null
    forward_pass_log_indices: null
    mp4_track_viz_indices: null

augmentations:
  probability: 0

modes:
  validate_at_start: false
  do_initial_static_pretrain: false
  pretrain_only: false
  eval_only: false
  debug: false

logging:
  log_wandb: false
  tags: ["nusctrack", "surround_tap", "finetune", "kubric-pretrained"]
